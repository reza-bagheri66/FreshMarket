{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 mt-4">
            <div class="card-header bg-success text-white text-center py-3">
                <h5 class="mb-0 fw-bold">ورود به حساب کاربری</h5>
            </div>
            <div class="card-body p-4">
                
                {% if request.GET.next %}
                    <div class="alert alert-info small text-center mb-3">
                        برای ادامه، لطفاً وارد شوید یا حساب کاربری جدید بسازید.
                    </div>
                {% endif %}

                <!-- فرم ورود -->
                <form method="post">
                    {% csrf_token %}
                    
                        {% if request.GET.next %}
                    <input type="hidden" name="next" value="{{ request.GET.next }}">
                    {% endif %}

                    <div class="mb-3">
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">شماره موبایل</label>
                        <input type="text" name="username" class="form-control" placeholder="شماره موبایل خود را وارد کنید" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">رمز عبور</label>
                        <input type="password" name="password" class="form-control" placeholder="رمز عبور" required>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-success btn-lg">ورود به سیستم</button>
                    </div>
                </form>

                <!-- خط جداکننده -->
                <hr class="my-4">

                <!-- بخش ثبت‌نام برای کاربران جدید -->
                <div class="text-center">
                    <p class="text-muted small mb-2">هنوز در سایت ثبت‌نام نکرده‌اید؟</p>
                    <a href="{% url 'accounts:register' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}" class="btn btn-outline-success w-100">
                        ثبت‌نام حساب کاربری جدید
                    </a>
                </div>

            </div>
        </div>
    </div>
</div>
{% endblock %}
