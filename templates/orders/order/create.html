<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ثبت سفارش | FreshMarket</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f8f9fa; margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; font-size: 22px; }
        .order-summary { background: #f1f3f5; padding: 15px; border-radius: 6px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ced4da; border-radius: 4px; }
        .btn-submit { background: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>تکمیل و ثبت سفارش 🛒</h1>
        
        <div class="order-summary">
            <h3>خلاصه سبد خرید شما:</h3>
            <ul>
                {% for item in cart %}
                    <li>{{ item.product.name }} - تعداد: {{ item.quantity }} - قیمت کل: {{ item.total_price }} تومان</li>
                {% endfor %}
            </ul>
            <p><strong>مجموع قابل پرداخت: {{ cart.get_total_price }} تومان</strong></p>
        </div>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-submit">ثبت نهایی سفارش</button>
        </form>
    </div>
</body>
</html>
