<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshMarket | فروشگاه‌های محلی</title>
    <!-- لینک بوت‌استرپ ۵ نسخه راست‌چین (RTL) برای ظاهر زیبا و مرتب -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- نوار ناوبری (هدر سایت) -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold text-success" href="{% url 'stores:store_list' %}">FreshMarket</a>
            
            <div class="d-flex align-items-center">
                {% if user.is_authenticated %}
                    <a href="{% url 'stores:vendor_dashboard' %}" class="btn btn-outline-primary btn-sm me-2">
                        پنل فروشگاه من
                    </a>
                    <span class="text-secondary small me-3">سلام، {{ user.username }}</span>
                {% else %}
                    <a href="{% url 'accounts:login' %}" class="btn btn-outline-success btn-sm me-2">ورود</a>
                    <a href="{% url 'stores:store_register' %}" class="btn btn-success btn-sm">ثبت‌نام فروشگاه</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- محتوای اصلی صفحات (مثل لیست فروشگاه‌ها، پنل و...) اینجا قرار می‌گیرد -->
    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <!-- اسکریپت‌های بوت‌استرپ -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
