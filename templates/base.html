<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshMarket | فروشگاه‌های محلی</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">

    <!-- استایل‌های اختصاصی برای قفل کردن ابعاد، فونت‌ها و جلوگیری از پرش -->
    <style>
        .brand-logo {
            font-size: 24px !important;
            font-weight: 700 !important;
            font-family: Tahoma, sans-serif !important;
            line-height: normal !important;
            display: inline-block !important;
            text-decoration: none !important;
        }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top" style="height: 70px;">
        <div class="container d-flex justify-content-between align-items-center" style="max-width: 1140px;">
        
            <!-- ۱. سمت راست: لوگوی FreshMarket -->
            <a class="navbar-brand brand-logo text-success m-0" href="{% url 'stores:store_list' %}">FreshMarket</a>

            <!-- ۲. وسط افقی صفحه: عبارت سلام رضا -->
            <div class="flex-grow-1 text-center">
                {% if user.is_authenticated %}
                    <span class="text-secondary fw-bold">سلام {{ user.first_name }}</span>
                {% endif %}
            </div>

            <!-- ۳. سمت چپ: دکمه‌های با ابعاد ثابت و یکسان -->
            <div class="d-flex align-items-center gap-2">
                {% if user.is_authenticated %}
                    <a href="{% url 'accounts:logout' %}" class="btn btn-danger btn-sm" style="width: 140px; text-align: center;">خروج</a>
                    {% if user.store %}
                        <a href="{% url 'stores:vendor_dashboard' %}" class="btn btn-primary btn-sm" style="width: 140px; text-align: center;">پنل فروشگاه من</a>
                    {% else %}
                        <a href="{% url 'stores:store_register' %}" class="btn btn-success btn-sm" style="width: 140px; text-align: center;">ثبت‌نام فروشگاه</a>
                    {% endif %}
                {% else %}
                    <a href="{% url 'accounts:login' %}" class="btn btn-outline-success btn-sm" style="width: 140px; text-align: center;">ورود / ثبت‌نام</a>
                    <a href="{% url 'stores:store_register' %}" class="btn btn-success btn-sm" style="width: 140px; text-align: center;">ثبت‌نام فروشگاه</a>
                {% endif %}
            </div>

        </div>
    </nav>

    <main class="container" style="max-width: 1140px; padding-top: 90px;">
        {% block content %}
        {% endblock %}
    </main>

    <!-- اسکریپت‌های بوت‌استرپ -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
