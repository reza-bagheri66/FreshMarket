<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshMarket | فروشگاه‌های محلی</title>
    <!-- لینک بوت‌استرپ ۵ نسخه راست‌چین (RTL) برای ظاهر زیبا و مرتب -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
        <!-- استفاده از justify-content-center برای وسط‌چین کردن کل اجزا و gap برای فاصله بین آن‌ها -->
        <div class="container d-flex justify-content-center align-items-center gap-4">
            <a class="navbar-brand fw-bold text-success m-0" href="{% url 'stores:store_list' %}">FreshMarket</a>

            <div class="d-flex align-items-center">
                {% if user.is_authenticated %}
                    <!-- دکمه خروج دقیقا جای ورود/ثبت‌نام با رنگ قرمز کامل -->
                    <a href="{% url 'accounts:logout' %}" class="btn btn-danger btn-sm me-2">خروج</a>

                    <!-- بررسی فروشگاه کاربر با دکمه سبز کامل -->
                    {% if user.store %}
                        <a href="{% url 'stores:vendor_dashboard' %}" class="btn btn-primary btn-sm me-2">پنل فروشگاه من</a>
                    {% else %}
                        <a href="{% url 'stores:store_register' %}" class="btn btn-success btn-sm me-2">ثبت‌نام فروشگاه</a>
                    {% endif %}

                    <span class="text-secondary small">سلام {{ user.first_name }}</span>
                {% else %}
                    <a href="{% url 'accounts:login' %}" class="btn btn-outline-success btn-sm me-2">ورود / ثبت‌نام</a>
                    <a href="{% url 'stores:store_register' %}" class="btn btn-success btn-sm">ثبت‌نام فروشگاه</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- محتوای اصلی صفحات (مثل لیست فروشگاه‌ها، پنل و...) اینجا قرار می‌گیرد -->
    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <!-- اسکریپت‌های بوت‌استرپ -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
